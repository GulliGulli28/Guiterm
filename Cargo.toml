[workspace]
resolver = "3"
# `app` and `term` (the retired iced UI) are intentionally left out of the
# workspace members — kept on disk for reference since nothing is committed
# to git yet, but no longer built. The UI now lives in `src-tauri` + the
# React frontend at the repo root.
members = ["core", "src-tauri", "rdp-ipc"]
# `rdp-sidecar` is deliberately NOT a member here — it's its own separate
# Cargo workspace (see rdp-sidecar/Cargo.toml) so its dependency resolution
# never has to unify with `russh`'s. `rdp-ipc` has no risky dependencies of
# its own (just tokio + serde_json), so it's safe to share between both
# workspaces as a plain path dependency. See CLAUDE.md's "Pourquoi un
# processus RDP séparé" section.

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "MIT"

# Applies to the shipped binary only (`cargo build --release`), never to
# `cargo check`/`cargo test`/`cargo clippy`, so the everyday verification loop
# is unaffected. Cargo profiles are only read from the workspace root, hence
# here rather than in `src-tauri/Cargo.toml` — `rdp-sidecar` is a separate
# workspace and carries its own copy of this block.
[profile.release]
# Tuned for runtime speed, NOT binary size. Measured on the shipped MSVC
# target rather than assumed: this makes `guiterm.exe` slightly *bigger*, not
# smaller, because Windows keeps debug symbols in a separate `.pdb` (~8 MB)
# instead of in the executable, so there is little for `strip` to remove while
# cross-crate inlining adds real code.
#
# Thin LTO rather than "fat": most of the cross-crate inlining win for a
# fraction of the link time, which matters because this dependency graph is
# large (russh + sqlx + kube + mongodb + bollard + reqwest) and the release
# binary gets rebuilt by hand for every manual Windows test.
lto = "thin"
# `codegen-units = 1` was tried here and removed: it took the full release
# build from a few minutes to ~25, because it serialises all of codegen, and
# after thin LTO the extra whole-crate optimisation it buys is marginal. Not
# worth that on a project whose workflow rebuilds the release binary by hand
# after every change. Leave it at the default (16) unless someone measures a
# runtime win that justifies the wait.
#
# No measurable effect on MSVC (see above), but it does strip the Linux build,
# where symbols live in the binary itself. Panic messages survive either way;
# only backtrace frame names are lost.
strip = true
# Deliberately NOT `panic = "abort"`: `ssh::AppHandler::check_server_key`
# recovers from a panic inside `spawn_blocking` by turning the `JoinError`
# into a refused host key (see its `unwrap_or_else`). Aborting would kill the
# whole app there instead of failing that one connection, and tokio can't
# catch a panic that aborts.

[workspace.dependencies]
termius-core = { path = "core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }

russh = "0.61"
russh-sftp = "2.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

keyring = "4"
directories = "6"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
