[package]
name = "termius-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
russh.workspace = true
# `logging`: the shipped Windows binary has no console (`windows_subsystem =
# "windows"`), so tracing output has to go to a file to be retrievable at all
# — see that module's doc comment. `env-filter` to honour `RUST_LOG`.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = "0.2"
russh-sftp.workspace = true
serde.workspace = true
serde_json.workspace = true
# `ansible_inventory`: real inventories come in both the INI-ish and the YAML
# syntax, and hand-rolling the second is not a reasonable idea.
#
# This crate is marked deprecated upstream. Taken anyway because `kube-client`
# already pulls it into this workspace's dependency graph — so it is compiled
# either way, and a security fix would concern us through `kube` regardless.
# The parsing surface is kept to `from_str` + `Value` walking (see
# `ansible_inventory::parse_yaml`), so swapping it for a maintained parser
# stays a contained change rather than a rewrite.
serde_yaml = "0.9"
keyring.workspace = true
directories.workspace = true
anyhow.workspace = true
uuid.workspace = true
zeroize.workspace = true
tracing.workspace = true
async-trait = "0.1"
# Key generation: an OS randomness source compatible with the `rand_core`
# version `ssh-key` (a transitive dependency via `russh`) actually resolves
# to — `russh::keys::ssh_key` doesn't re-export one itself.
getrandom = { version = "0.4.3", features = ["sys_rng"] }
bollard = "0.21"
futures-util = "0.3"
# `docker_pane`: builds/reads the single-entry tar archives the Docker Engine
# API's container-archive endpoints (`GET/PUT /containers/{id}/archive`) speak.
# `pane_ops`: writes the .tar.gz a local transfer pane's "Archiver" button
# produces (a remote pane runs the host's own `tar` instead, nothing crosses
# the network) — hence `flate2` next to it, and `zip` for the other format.
tar = "0.4"
flate2 = "1"
# `deflate` only: the other compression methods (bzip2, zstd, lzma) each pull
# their own C or Rust codec in for a format nothing here writes.
zip = { version = "4", default-features = false, features = ["deflate"] }
# `pane_ops::disk_space` pour le panneau local : `statvfs` sous Unix,
# `GetDiskFreeSpaceExW` sous Windows, derrière une seule fonction. La
# bibliothèque standard n'expose rien pour l'espace libre, et les deux appels
# système sont du `unsafe` spécifique à chaque plateforme qu'on préfère ne pas
# écrire ici. `default-features = false` : seule l'API synchrone sert, les
# variantes tokio/async-std/smol tireraient un runtime de plus.
fs4 = { version = "1", default-features = false, features = ["sync"] }
# `file_diff` : comparer le contenu de deux fichiers ligne à ligne. Un diff
# correct n'est pas une boucle de comparaison — c'est un algorithme (Myers,
# et le repli en patience quand les lignes se répètent), et l'écrire à la
# main pour le voir dériver sur les cas tordus ne se justifie pas.
# `default-features = false` + `text` : seul le diff de texte sert, pas les
# variantes bytes/unicode-segmentation.
# `inline` : le diff au mot à l'intérieur d'une ligne modifiée. Sans lui on
# sait qu'une ligne a changé, pas où — sur une ligne de 200 caractères dont
# un port a bougé, c'est toute la différence entre voir et chercher.
similar = { version = "3", default-features = false, features = ["std", "text", "inline"] }
# `docker::connect_via_ssh`: speaks the Docker Engine API over a `russh` exec
# channel (`docker system dial-stdio`) instead of a socket/TCP connection —
# same major version bollard itself resolves (`hyper = "1.3"`, `hyper-util =
# "0.1.5"`), so Cargo unifies rather than pulling in a second copy. Goes
# through `hyper_util::client::legacy::Client` (not the lower-level
# `hyper::client::conn` API — see `docker::connect_via_ssh`'s doc comment for
# why that matters), same as bollard's own `http`/`pipe`/`ssh` transports
# internally, hence the matching feature set.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "client-legacy", "tokio"] }
tower-service = "0.3"
# Master-password vault (optional, opt-in): Argon2id KDF + XChaCha20-Poly1305 AEAD.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
# `adaptive`: calls the Anthropic Messages API to generate a per-OS command
# from a natural-language intent. rustls (not native-tls) to avoid an
# OpenSSL dependency; default-features off + explicit `json` since we only
# ever do one POST with a JSON body/response, nothing else reqwest offers.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `k8s`/`k8s_pane`: talks to the Kubernetes API server for pod exec sessions
# (`ws` feature — pod attach/exec runs over a WebSocket, not plain HTTP).
# Checked against the RDP/ecdsa saga before adding (see CLAUDE.md's "Pourquoi
# un processus RDP séparé") — resolves cleanly alongside russh/bollard/reqwest
# with no exact-pin conflict, unlike ironrdp-connector's `picky` dependency;
# no separate workspace needed here.
kube = { version = "0.99", default-features = false, features = ["client", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
# `sql`: MySQL/PostgreSQL client — checked against the RDP/ecdsa saga before
# adding (see CLAUDE.md's "Pourquoi un processus RDP séparé"), resolves
# cleanly alongside russh/bollard/reqwest/kube, no separate workspace needed.
# Native `postgres`/`mysql` pools, not the generic `any` driver: `any` only
# decodes a closed 9-variant type set (bool/int widths/float widths/text/
# blob/null) — real tables routinely have NUMERIC/TIMESTAMP(TZ)/UUID/JSON(B)
# columns, none of which fit that set, so `any` hard-fails the entire query
# the moment one appears (verified against a real Postgres server, not just
# reasoned about). `rust_decimal`/`json` add decode support for NUMERIC (as
# an exact string — `f64` would silently round monetary amounts) and JSON(B).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
# Forces `sqlx-sqlite`'s own `libsqlite3-sys` dependency to statically
# compile SQLite from vendored C source (Cargo feature unification applies
# `bundled` workspace-wide the moment *any* crate enables it) rather than
# linking a system libsqlite3 via pkg-config — the latter isn't present on a
# fresh Windows build machine (see CLAUDE.md's native-Windows build section)
# and would otherwise fail `cargo build` there with no local workaround.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# Already resolved transitively (reqwest/sqlx) — declared directly since
# `sql::build_url` uses its setters (percent-encoding credentials safely,
# see that function's doc comment) rather than just consuming it.
url = "2"
# Déjà résolu transitivement (tracing-appender, tauri) — déclaré directement
# pour l'horodatage du fichier de paniques (`logging::install_panic_hook`),
# qui doit être lisible et dans le même fuseau UTC que le journal quotidien.
time = { version = "0.3", features = ["formatting"] }
# `redis_client`: Redis client — checked against the RDP/ecdsa saga before
# adding (see CLAUDE.md's "Pourquoi un processus RDP séparé"). `tokio-comp`
# for the async API; `connection-manager` for `redis::aio::ConnectionManager`,
# an auto-reconnecting multiplexed connection used in place of a real pool
# (redis-rs has none of its own — a single multiplexed connection matches
# this app's per-tab usage, not a connection-per-request web server). No TLS
# feature: `sql::build_url` has no TLS support today for MySQL/PostgreSQL
# either, and it wouldn't make sense through this app's SSH-tunnel path
# anyway (a cert issued for the real host would never match `127.0.0.1`) —
# revisit as a cross-engine addition later if needed, not Redis-only.
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
# `mongo_client`: official MongoDB driver — checked against the RDP/ecdsa
# saga before adding (see CLAUDE.md's "Pourquoi un processus RDP séparé"),
# and actually compiled (not just `cargo check`) to confirm no exact-pin
# conflict — a single resolved `chrono`/`rustls`/`time`/`hickory-resolver`
# throughout, matching what was already there before this line. `bson-3` +
# `compat-3-3-0`: with `default-features = false`, exactly one of `bson-2`/
# `bson-3` is mandatory (selects which major version of the separate `bson`
# crate the driver uses internally), not optional — the crate fails to
# *compile* (not just resolve) without one. `rustls-tls` to stay consistent
# with this workspace's rustls-only policy (reqwest/kube/sqlx all use it,
# never native-tls/OpenSSL); `dns-resolver` for `mongodb+srv://` (Atlas)
# SRV/TXT resolution — resolved `hickory-resolver` version is well past the
# old Windows-specific DNS performance bug, worth checking explicitly since
# this app's primary shipped target is native Windows.
mongodb = { version = "3", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver"] }
# Same underlying crate as `mongodb`'s internal `bson3` dependency (Cargo
# unifies features across every requester of one resolved package) — added
# directly only to turn on `serde_json-1`, which `mongodb`'s own dependency
# declaration doesn't enable by default and which `mongo_client` needs for
# `Bson::try_from(serde_json::Value)`/`Bson::into_relaxed_extjson` (the
# Extended JSON conversions the "Requête"/"Données" tabs are built on).
bson = { version = "3", features = ["serde_json-1"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "docker_ssh_debug"

[[example]]
name = "sql_wsl_smoke"

[[example]]
name = "redis_wsl_smoke"

[[example]]
name = "mongo_wsl_smoke"
