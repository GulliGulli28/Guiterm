name: Release

# Builds the Windows and Linux installers and publishes them as a draft
# GitHub Release whenever a `v*` tag is pushed (or manually via the Actions
# tab). The in-app updater checks the latest published release's
# `latest.json`, so publishing the draft is what makes an update visible to
# users. Both platform jobs target the same tag/release: tauri-action
# creates the draft on the first job to finish and appends assets from the
# other, so which one runs first doesn't matter.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # ubuntu-22.04, not ubuntu-latest (24.04): the .deb/.rpm/AppImage
          # link against the runner's glibc, and 24.04's is too new for
          # older user systems to run the resulting binary.
          - platform: ubuntu-22.04
          # Two macOS runners rather than one universal binary: `macos-latest`
          # is Apple Silicon, `macos-13` is the last Intel image. Each produces
          # a native bundle for its own architecture, which avoids having to
          # `lipo` the rdp-sidecar into a universal binary of its own just to
          # satisfy `bundle.externalBin`.
          - platform: macos-latest
          - platform: macos-13
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned 2026-07-16 (dtolnay/rust-toolchain has no version tags — branches are the channel selector)

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # aws-lc-sys/ring (rdp-sidecar's TLS stack) need NASM to build their
      # assembly routines under MSVC — not reliably present on windows-latest
      # (checked the current runner image's software manifest: no NASM listed
      # as of the Windows Server 2025/VS2026 image windows-latest now points
      # to), so install it explicitly rather than assume. No-op on Linux.
      - uses: ilammy/setup-nasm@v1

      # rdp-sidecar is its own separate Cargo workspace (see rdp-sidecar/Cargo.toml
      # and CLAUDE.md's "RDP intégré : architecture sidecar" section) — the root
      # `cargo build --workspace` never touches it, and tauri-action's `tauri build`
      # doesn't know how to build it either. It has to be built and placed at
      # `src-tauri/binaries/rdp-sidecar-<host-triple>[.exe]` ourselves, before
      # tauri-action runs, or the build fails outright: tauri-build's build.rs
      # checks `bundle.externalBin` paths exist even to just compile the main crate.
      - name: Build rdp-sidecar and stage it for bundling (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd rdp-sidecar && cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rdp-sidecar.exe ../src-tauri/binaries/rdp-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build rdp-sidecar and stage it for bundling (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd rdp-sidecar && cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rdp-sidecar ../src-tauri/binaries/rdp-sidecar-x86_64-unknown-linux-gnu

      # Same staging step as the two above, but the triple is read from rustc
      # instead of hardcoded: this job runs on both an Apple Silicon and an
      # Intel runner, so it has to resolve to `aarch64-apple-darwin` or
      # `x86_64-apple-darwin` depending on which one it landed on.
      - name: Build rdp-sidecar and stage it for bundling (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          cd rdp-sidecar && cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rdp-sidecar "../src-tauri/binaries/rdp-sidecar-$TRIPLE"

      # `TAURI_SIGNING_*` below signs the *updater* artifacts (minisign) — it
      # is what makes the in-app updater trust a release, and is unrelated to
      # OS code signing. Neither platform is OS-signed today:
      #   - Windows: no Authenticode certificate, so SmartScreen warns on
      #     first run of every new release.
      #   - macOS: no Apple Developer ID, so Gatekeeper refuses to open the
      #     .dmg outright ("cannot be opened because the developer cannot be
      #     verified") — users have to right-click → Open, or clear the
      #     quarantine attribute by hand. Worth stating in the release notes
      #     until a certificate exists; tauri-action reads APPLE_CERTIFICATE /
      #     APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      #     from the environment once there is one to add.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Guiterm ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
