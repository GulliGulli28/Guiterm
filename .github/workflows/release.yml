name: Release

# Builds the Windows and Linux installers and publishes them as a draft
# GitHub Release whenever a `v*` tag is pushed (or manually via the Actions
# tab). The in-app updater checks the latest published release's
# `latest.json`, so publishing the draft is what makes an update visible to
# users. Both platform jobs target the same tag/release: tauri-action
# creates the draft on the first job to finish and appends assets from the
# other, so which one runs first doesn't matter.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Grouped like the others, but **never cancelled**, and that difference is the
# whole point: a build interrupted halfway is exactly how v2.4.0 shipped with a
# missing installer. Grouping still prevents two runs on the same tag (a
# `workflow_dispatch` fired while the tag push is still building, say); the
# second one waits its turn instead of killing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # ubuntu-22.04, not ubuntu-latest (24.04): the .deb/.rpm/AppImage
          # link against the runner's glibc, and 24.04's is too new for
          # older user systems to run the resulting binary.
          - platform: ubuntu-22.04
          # Two macOS runners rather than one universal binary: `macos-latest`
          # is Apple Silicon, `macos-15-intel` is the x86_64 image. Each
          # produces a native bundle for its own architecture, which avoids
          # having to `lipo` the rdp-sidecar into a universal binary of its own
          # just to satisfy `bundle.externalBin`.
          #
          # This said `macos-13` up to 2.4.0, by which point that image no
          # longer existed: the job sat unassigned for 40 minutes and was
          # cancelled, so the release shipped with no Intel .dmg and no
          # `darwin-x86_64` entry in latest.json, while the other three jobs
          # stayed green. Both `-intel` labels are *standard* runners — free
          # and unlimited on a public repo, unlike the `-large`/`-xlarge` ones,
          # which are billed even there.
          - platform: macos-latest
          - platform: macos-15-intel
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned 2026-07-16 (dtolnay/rust-toolchain has no version tags — branches are the channel selector)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        run: npm ci

      # aws-lc-sys/ring (rdp-sidecar's TLS stack) need NASM to build their
      # assembly routines under MSVC — not reliably present on windows-latest
      # (checked the current runner image's software manifest: no NASM listed
      # as of the Windows Server 2025/VS2026 image windows-latest now points
      # to), so install it explicitly rather than assume. No-op on Linux.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      # rdp-sidecar is its own separate Cargo workspace (see rdp-sidecar/Cargo.toml
      # and CLAUDE.md's "RDP intégré : architecture sidecar" section) — the root
      # `cargo build --workspace` never touches it, and tauri-action's `tauri build`
      # doesn't know how to build it either. It has to be built and placed at
      # `src-tauri/binaries/rdp-sidecar-<host-triple>[.exe]` ourselves, before
      # tauri-action runs, or the build fails outright: tauri-build's build.rs
      # checks `bundle.externalBin` paths exist even to just compile the main crate.
      - name: Build rdp-sidecar and stage it for bundling (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd rdp-sidecar && cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rdp-sidecar.exe ../src-tauri/binaries/rdp-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build rdp-sidecar and stage it for bundling (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd rdp-sidecar && cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rdp-sidecar ../src-tauri/binaries/rdp-sidecar-x86_64-unknown-linux-gnu

      # Same staging step as the two above, but the triple is read from rustc
      # instead of hardcoded: this job runs on both an Apple Silicon and an
      # Intel runner, so it has to resolve to `aarch64-apple-darwin` or
      # `x86_64-apple-darwin` depending on which one it landed on.
      - name: Build rdp-sidecar and stage it for bundling (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          cd rdp-sidecar && cargo build --release
          mkdir -p ../src-tauri/binaries
          cp target/release/rdp-sidecar "../src-tauri/binaries/rdp-sidecar-$TRIPLE"

      # macOS code signing + notarization, wired but dormant until the Apple
      # secrets exist (see RELEASING.md, "Signature par le système
      # d'exploitation"). Without them the .app ships with only the ad-hoc
      # signature the linker puts on every arm64 binary, and Gatekeeper does
      # not say "unverified developer" — it says the app is **damaged and
      # should be moved to the Trash** (issue #27), which on macOS 15+ can no
      # longer be dismissed by right-click → Open.
      #
      # Why a step that writes to $GITHUB_ENV instead of plain `env:` entries
      # on the build step below: a GitHub secret that doesn't exist still
      # yields a *defined but empty* environment variable, and tauri-bundler
      # only tests for presence (`var_os("APPLE_CERTIFICATE")`, see its
      # macos/sign.rs). Passing them unconditionally would therefore make it
      # import an empty .p12 and fail every macOS build until the day the
      # secrets are added — so export each variable only when it is non-empty.
      - name: Export Apple signing credentials (no-op until the secrets exist)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning title=Unsigned macOS build::No APPLE_CERTIFICATE secret configured — the .app will be unsigned and Gatekeeper will report it as damaged on the user's machine. See RELEASING.md."
            exit 0
          fi
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$var}"
            # An empty APPLE_ID/APPLE_TEAM_ID would make the bundler attempt
            # notarization with blank credentials rather than skip it.
            [ -n "$value" ] || continue
            printf '%s<<__GUITERM_EOF__\n%s\n__GUITERM_EOF__\n' "$var" "$value" >> "$GITHUB_ENV"
          done
          echo "Apple signing credentials exported for this job."

      # `TAURI_SIGNING_*` below signs the *updater* artifacts (minisign) — it
      # is what makes the in-app updater trust a release, and is unrelated to
      # the OS-level signing above. Windows is still unsigned either way (no
      # Authenticode certificate), so SmartScreen warns on first run of every
      # new release.
      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Guiterm ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

  # ── Le contrôle que la 2.4.0 n'avait pas ────────────────────────────────
  #
  # Les quatre jobs ci-dessus alimentent la *même* release brouillon : celui
  # qui finit en premier la crée, les autres y ajoutent leurs artefacts. La
  # conséquence, découverte en production sur la 2.4.0, est qu'un job qui
  # n'aboutit pas ne se voit **nulle part** dans la release — elle existe, elle
  # a l'air normale, il lui manque simplement un installeur. Ce jour-là le job
  # Intel visait `macos-13`, une image de runner supprimée depuis : il n'a
  # jamais obtenu de machine, a été annulé au bout de 40 minutes, et la version
  # est partie avec un seul `.dmg` sur les deux et sans entrée
  # `darwin-x86_64` dans `latest.json`. Les trois autres jobs étaient verts.
  #
  # RELEASING.md demande donc de vérifier les quatre jobs à la main avant de
  # publier le brouillon. Ce job remplace cette consigne par un échec bruyant.
  verify-release:
    needs: release
    # `always()` est indispensable : sans lui, un job de matrice annulé fait
    # *sauter* cette vérification — précisément le cas qu'elle existe pour
    # attraper. La condition sur le tag écarte le seul cas où elle échouerait
    # pour la mauvaise raison : un `workflow_dispatch` lancé depuis une branche
    # produit une release nommée d'après la branche, qu'il n'y a pas lieu de
    # contrôler comme une vraie version.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Le job ne fait que lire — mais une release **brouillon** n'est visible
      # que d'un jeton disposant d'un accès en écriture (GitHub ne montre les
      # brouillons qu'aux comptes qui peuvent pousser). Avec `contents: read`,
      # le téléchargement échouerait et le contrôle passerait au vert sans
      # avoir rien contrôlé, ce qui serait pire que pas de contrôle du tout.
      contents: write
    steps:
      - name: Les quatre plateformes ont-elles produit leur installeur ?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          MATRIX_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail

          # 1. Aucun job de la matrice ne doit avoir échoué, été annulé ou
          #    sauté. `fail-fast: false` laisse les autres aller au bout, donc
          #    ce résultat agrégé est le seul endroit où l'absence se voit.
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error title=Release incomplète::La matrice de build a fini en « $MATRIX_RESULT ». Un installeur manque probablement dans le brouillon $TAG — NE PAS le publier avant d'avoir relancé le job en échec (Re-run failed jobs suffit si les bundles étaient déjà construits, voir RELEASING.md)."
            exit 1
          fi

          # 2. Et le fichier que l'updater consulte doit couvrir les quatre
          #    plateformes. C'est l'assertion la plus proche du symptôme réel :
          #    en 2.4.0, c'est l'entrée `darwin-x86_64` qui manquait.
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir . ; then
            echo "::error title=latest.json absent::Le brouillon $TAG ne porte pas de latest.json — l'updater intégré n'a rien à consulter, aucune installation existante ne verrait cette version."
            exit 1
          fi

          missing=""
          for platform in windows-x86_64 linux-x86_64 darwin-x86_64 darwin-aarch64; do
            if ! jq -e --arg p "$platform" '.platforms | has($p)' latest.json > /dev/null; then
              missing="$missing $platform"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Plateformes manquantes::latest.json ne couvre pas :$missing. Les installations sur ces plateformes ne verraient jamais la mise à jour. NE PAS publier le brouillon $TAG en l'état."
            echo "Ce que le brouillon contient réellement :"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true
            exit 1
          fi

          echo "Les quatre plateformes sont présentes dans latest.json — le brouillon $TAG est publiable."
          jq -r '.platforms | keys[]' latest.json
