[package]
name = "guiterm"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "guiterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
termius-core.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
base64 = "0.22"
portable-pty = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
rdp-ipc = { path = "../rdp-ipc" }
# `commands::interactive_auth`: implements `core`'s async `Prompter` trait,
# which `#[async_trait]` on the trait definition requires on the impl side too.
async-trait = "0.1"
tracing = "0.1"
# Pinned: cookie 0.18.1 (pulled in by tauri/wry) calls a `time` API in a way
# that newer 0.3.x releases (>=0.3.48) made a breaking change to. 0.3.47 is
# the oldest version `plist` (also pulled in by tauri) still accepts.
# Jamais `use`ée ici — c'est une contrainte de résolution, pas du code. D'où
# l'entrée `cargo-machete` en bas de ce fichier : l'outil ne peut pas le
# deviner, et sans elle il redemande sa suppression à chaque passage.
time = "=0.3.47"
tauri-plugin-opener = "2"
# Retient taille, position et état maximisé de la fenêtre d'un lancement à
# l'autre. Sans lui, `tauri.conf.json` réimpose 1280x800 à chaque démarrage —
# ce qui, sur un écran large ou en multi-écran, se remarque tous les jours.
tauri-plugin-window-state = "2"

# `time` est déclarée pour épingler une version transitive, jamais appelée
# depuis ce crate (voir son commentaire plus haut). Sans cette exception,
# `cargo machete` la signale à chaque exécution comme inutilisée, ce qui finit
# par apprendre à ignorer l'outil — or il vient de trouver un vrai doublon
# (`tracing-subscriber`, retiré le 2026-09-08).
[package.metadata.cargo-machete]
ignored = ["time"]
